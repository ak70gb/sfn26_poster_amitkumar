<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact &amp; links – SfN 2026 poster</title>
<style>
  :root{--navy:#23384a;--ink:#152d43;--slate:#9fb0bf;--tint:#dfe6ec;--bg:#f4f7fa;--accent:#d9532f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
  .wrap{max-width:560px;margin:0 auto}
  main{padding:24px 18px}
  .card{background:#fff;border:1px solid var(--slate);border-radius:12px;margin:0 0 14px;overflow:hidden}
  .card h2{margin:0;background:var(--tint);color:var(--navy);font-size:14px;letter-spacing:.03em;text-transform:uppercase;padding:8px 14px}
  a.row{display:flex;align-items:center;gap:12px;padding:14px;text-decoration:none;color:var(--ink);border-top:1px solid #edf1f4}
  .card h2 + a.row{border-top:none}
  a.row:active,a.row:hover{background:#f6f9fb}
  .ic{flex:0 0 38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:17px}
  .ic.laser{background:var(--accent)}
  .t{font-weight:700;font-size:16px}
  .s{font-size:13.5px;color:#4a5d70;overflow-wrap:anywhere}
  .go{margin-left:auto;color:var(--slate);font-size:22px}
  .head{padding:4px 2px 18px}
  .kicker{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5f7182;margin:0 0 4px}
  .authors{margin:0 0 16px;font-size:12.5px;line-height:1.4;color:#5f7182}
  .ptitle{margin:0 0 6px;font-size:14.5px;line-height:1.4;font-weight:600;color:#3d5268}
  h1{margin:0;font-size:26px;line-height:1.2;color:var(--navy)}
  h1::after{content:"";display:block;width:44px;height:3px;background:var(--accent);border-radius:2px;margin-top:10px}
</style>
</head>
<body>
<main class="wrap">
  <div class="head"><h1>Contact &amp; links</h1></div>
  <section class="card">
    <h2>Research group</h2>
    <a class="row" href="https://www.institut-vision.org/en/research/wavefront-engineering-microscopy"><span class="ic">⌂</span><span><span class="t">Wavefront Engineering Microscopy Group</span><br><span class="s">Institut de la Vision, Paris</span></span><span class="go">›</span></a>
  </section>
  <section class="card">
    <h2>Laser source</h2>
    <a class="row" href="https://www.laseratwork.com/products/merlin-1030"><span class="ic laser">✦</span><span><span class="t">Merlin-1030</span><br><span class="s">1030 nm femtosecond laser<br>LaserAtWork GmbH</span></span><span class="go">›</span></a>
  </section>
  <section class="card">
    <h2>Contact</h2>
    <a class="row" href="mailto:amit.kumar@inserm.fr"><span class="ic">✉</span><span><span class="t">Amit Kumar</span><br><span class="s">amit.kumar@inserm.fr</span></span><span class="go">›</span></a>
    <a class="row" href="mailto:valentina.emiliani@inserm.fr"><span class="ic">✉</span><span><span class="t">Valentina Emiliani</span><br><span class="s">valentina.emiliani@inserm.fr</span></span><span class="go">›</span></a>
  </section>
</main>
</body>
</html>
